<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"}}

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// Standalone gameplay runtime. This file is also inlined into exported HTML games,
// so it must only depend on three.js (no app modules, no React).



const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const comp = (obj, type) => (obj.components || []).find((c) => c.type === type) || null;

function makeGeometry(kind) {
  switch (kind) {
    case "sphere":
      return new THREE.SphereGeometry(0.5, 32, 24);
    case "capsule":
      return new THREE.CapsuleGeometry(0.4, 0.9, 10, 20);
    case "cylinder":
      return new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
    case "plane":
      return new THREE.PlaneGeometry(1, 1);
    default:
      return new THREE.BoxGeometry(1, 1, 1);
  }
}

function localMatrix(transform = {}) {
  const p = transform.position || [0, 0, 0];
  const r = transform.rotation || [0, 0, 0];
  const s = transform.scale || [1, 1, 1];
  return new THREE.Matrix4().compose(
    new THREE.Vector3(p[0], p[1], p[2]),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(r[0] * DEG, r[1] * DEG, r[2] * DEG, "XYZ")),
    new THREE.Vector3(s[0] || 0.0001, s[1] || 0.0001, s[2] || 0.0001)
  );
}

function worldMatrix(obj, byId, cache) {
  if (cache.has(obj.id)) return cache.get(obj.id);
  const local = localMatrix(obj.transform);
  const parent = obj.parentId ? byId.get(obj.parentId) : null;
  const matrix = parent ? worldMatrix(parent, byId, cache).clone().multiply(local) : local;
  cache.set(obj.id, matrix);
  return matrix;
}

// Paints a baked vertex-color buffer (base64 bytes) onto a runtime mesh.
function applyBakedToMesh(mesh, encoded) {
  try {
    if (!mesh?.geometry?.attributes?.position) return;
    const raw = atob(encoded);
    const count = mesh.geometry.attributes.position.count;
    if (raw.length !== count * 3) return;
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < raw.length; i++) colors[i] = raw.charCodeAt(i) / 255;
    mesh.geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    const wasArray = Array.isArray(mesh.material);
    const originals = wasArray ? mesh.material : [mesh.material];
    const cloned = originals.map((material) => {
      if (!material) return material;
      const copy = material.clone();
      copy.vertexColors = true;
      copy.needsUpdate = true;
      return copy;
    });
    mesh.material = wasArray ? cloned : cloned[0];
  } catch {
    /* bake no longer matches this mesh — leave it unlit by the bake */
  }
}

class GamePlayer {
  constructor(options = {}) {
    this.renderer = options.renderer;
    this.container = options.container;
    this.data = options.sceneData || { objects: [], environment: {}, terrain: {} };
    this.materials = options.materials || [];
    this.assets = options.assets || [];
    this.scripts = options.scripts || [];
    this.settings = options.settings || {};
    this.onLog = options.onLog || (() => {});
    this.onError = options.onError || (() => {});
    this.onFps = options.onFps || (() => {});

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(60, 1, 0.1, 2000);
    this.rig = new THREE.Group();
    this.rig.add(this.camera);
    this.scene.add(this.rig);

    this.nodes = new Map();
    this.meshes = new Map();
    this.materials_cache = new Map();
    this.textures = new Map();
    this.bodies = [];
    this.dynamicBodies = [];
    this.controllers = [];
    this.cameras = [];
    this.instances = [];
    this.lights = [];
    this.pairs = new Map();
    this.disposables = [];

    this.clock = new THREE.Clock();
    this.keys = new Set();
    this.pressed = new Set();
    this.mouse = { dx: 0, dy: 0, down: false, locked: false };
    this.gravity = Number(this.settings.gravity ?? 22);
    this.paused = false;
    this.ready = false;
    this.disposed = false;
    this.elapsed = 0;
    this.dt = 0;
    this.fps = 0;
    this._fpsTime = 0;
    this._fpsFrames = 0;
    this.activeCamera = null;
    this.renderCamera = this.camera;
    this.xr = { supported: false, session: null, controllers: [], hands: [], checked: false };
    this.listeners = [];
    this.listener = null;
    this.audioLoader = null;

    this.input = {
      isDown: (key) => this.keys.has(String(key).toLowerCase()),
      wasPressed: (key) => this.pressed.has(String(key).toLowerCase()),
      mouseDown: () => this.mouse.down,
      get mouseDeltaX() {
        return 0;
      },
      lock: () => this.requestPointerLock(),
    };
  }

  // ---------------------------------------------------------------- lifecycle

  async start() {
    this.buildEnvironment();
    this.buildTerrain();
    const byId = new Map(this.data.objects.map((o) => [o.id, o]));
    const cache = new Map();
    await Promise.all(this.data.objects.map((obj) => this.buildObject(obj, byId, cache)));
    this.applyBakedLighting();
    this.buildPhysics(byId);
    this.buildControllers();
    this.buildCameras();
    this.initScripts();
    this.initInput();
    this.initAudio();
    this.ready = true;
    this.clock.start();
    this.renderer.setAnimationLoop(() => this.tick());
    this.onLog("Play mode started", "info");
  }

  setPaused(value) {
    this.paused = value;
  }

  dispose() {
    if (this.disposed) return;
    this.disposed = true;
    this.renderer.setAnimationLoop(null);
    if (this.xr.session) {
      try {
        this.xr.session.end();
      } catch {
        /* ignore */
      }
    }
    for (const off of this.listeners) off();
    this.listeners = [];
    this.scene.traverse((child) => {
      if (child.isMesh) {
        child.geometry?.dispose?.();
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        for (const m of mats) m?.dispose?.();
      }
    });
    for (const tex of this.textures.values()) tex.dispose();
    for (const mat of this.materials_cache.values()) mat.dispose();
    this.scene.clear();
    this.nodes.clear();
    this.meshes.clear();
    this.bodies = [];
    this.dynamicBodies = [];
    this.controllers = [];
    this.instances = [];
  }

  // ------------------------------------------------------------------ visuals

  buildEnvironment() {
    const env = this.data.environment || {};
    if (env.skyType === "gradient") {
      const geo = new THREE.SphereGeometry(400, 24, 16);
      const mat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          top: { value: new THREE.Color(env.skyTop || "#1d4d7a") },
          bottom: { value: new THREE.Color(env.skyBottom || "#b9cbd8") },
        },
        vertexShader: "varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader:
          "uniform vec3 top; uniform vec3 bottom; varying vec3 vPos; void main(){ float h = clamp(normalize(vPos).y * 0.5 + 0.5, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h, 0.85)), 1.0); }",
      });
      const sky = new THREE.Mesh(geo, mat);
      sky.frustumCulled = false;
      this.scene.add(sky);
      this.disposables.push(geo, mat);
      this.scene.background = new THREE.Color(env.skyTop || "#1d4d7a");
    } else {
      this.scene.background = new THREE.Color(env.skyColor || "#0d1117");
    }

    this.scene.add(new THREE.HemisphereLight(env.ambientColor || "#ffffff", "#1b2430", env.ambient ?? 0.6));

    if (env.fog?.enabled) {
      this.scene.fog = new THREE.Fog(new THREE.Color(env.fog.color || "#9db2c4"), env.fog.near ?? 30, env.fog.far ?? 120);
    }
  }

  buildTerrain() {
    const t = this.data.terrain;
    if (!t?.enabled || !t.heights?.length) return;
    const seg = t.segments || 48;
    const size = t.size || 60;
    const count = (seg + 1) * (seg + 1);
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const palette = [new THREE.Color("#5d8a4a"), new THREE.Color("#8a8578"), new THREE.Color("#c9b98d")];
    const step = size / seg;
    for (let iz = 0; iz <= seg; iz++) {
      for (let ix = 0; ix <= seg; ix++) {
        const i = iz * (seg + 1) + ix;
        positions[i * 3] = -size / 2 + ix * step;
        positions[i * 3 + 1] = t.heights[i] || 0;
        positions[i * 3 + 2] = -size / 2 + iz * step;
        const c = palette[t.paint?.[i] || 0] || palette[0];
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }
    }
    const indices = [];
    for (let iz = 0; iz < seg; iz++) {
      for (let ix = 0; ix < seg; ix++) {
        const a = iz * (seg + 1) + ix;
        const b = a + 1;
        const c = a + seg + 1;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    mesh.name = "Terrain";
    this.scene.add(mesh);
    this.terrainMesh = mesh;
    this.disposables.push(geo, mat);

    if (this.data.environment?.water?.enabled) {
      const water = this.data.environment.water;
      const wgeo = new THREE.PlaneGeometry(size * 1.6, size * 1.6);
      const wmat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(water.color || "#2d7091"),
        transparent: true,
        opacity: water.opacity ?? 0.72,
        roughness: 0.15,
        metalness: 0.2,
      });
      const plane = new THREE.Mesh(wgeo, wmat);
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = water.level ?? -0.45;
      this.scene.add(plane);
      this.disposables.push(wgeo, wmat);
    }
  }

  materialFor(rendererComp) {
    const record = rendererComp?.materialId ? this.materials.find((m) => m.id === rendererComp.materialId) : null;
    if (record) {
      const key = `m:${record.id}:${record.color}:${record.metallic}:${record.smoothness}:${record.opacity}:${record.texture_url || ""}`;
      let mat = this.materials_cache.get(key);
      if (!mat) {
        mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(record.color || "#b8c0cc"),
          metalness: clamp(Number(record.metallic ?? 0), 0, 1),
          roughness: clamp(1 - Number(record.smoothness ?? 0.5), 0.02, 1),
          transparent: Number(record.opacity ?? 1) < 1,
          opacity: clamp(Number(record.opacity ?? 1), 0, 1),
          side: THREE.DoubleSide,
        });
        if (record.texture_url) {
          new THREE.TextureLoader().load(record.texture_url, (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            mat.map = tex;
            mat.needsUpdate = true;
            this.textures.set(record.texture_url, tex);
          });
        }
        this.materials_cache.set(key, mat);
      }
      return mat;
    }
    const color = rendererComp?.color || "#b8c0cc";
    const key = `c:${color}`;
    let mat = this.materials_cache.get(key);
    if (!mat) {
      mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(color),
        roughness: 0.7,
        metalness: 0.05,
        side: THREE.DoubleSide,
      });
      this.materials_cache.set(key, mat);
    }
    return mat;
  }

  makeLight(def) {
    let light;
    if (def.lightType === "point") {
      light = new THREE.PointLight(new THREE.Color(def.color || "#ffffff"), def.intensity ?? 1.2, def.range ?? 14, 1.6);
    } else if (def.lightType === "spot") {
      light = new THREE.SpotLight(
        new THREE.Color(def.color || "#ffffff"),
        def.intensity ?? 2,
        def.range ?? 24,
        (def.angle ?? 40) * DEG,
        0.35,
        1.4
      );
    } else {
      light = new THREE.DirectionalLight(new THREE.Color(def.color || "#ffffff"), def.intensity ?? 1.2);
      light.target.position.set(0, 0, 0);
      this.scene.add(light.target);
    }
    if (def.castShadow) {
      light.castShadow = true;
      if (light.shadow) {
        light.shadow.mapSize.set(1024, 1024);
        light.shadow.camera.near = 0.5;
        light.shadow.camera.far = 90;
        if (light.shadow.camera.isOrthographicCamera) {
          light.shadow.camera.left = -40;
          light.shadow.camera.right = 40;
          light.shadow.camera.top = 40;
          light.shadow.camera.bottom = -40;
        }
      }
    }
    return light;
  }

  async buildObject(obj, byId, cache) {
    const node = new THREE.Group();
    node.name = obj.name;
    worldMatrix(obj, byId, cache).decompose(node.position, node.quaternion, node.scale);
    node.visible = obj.active !== false;
    node.userData.objectId = obj.id;
    this.scene.add(node);
    this.nodes.set(obj.id, node);

    const filter = comp(obj, "meshFilter");
    const renderer = comp(obj, "meshRenderer");
    if (filter && filter.primitive !== "model") {
      const mesh = new THREE.Mesh(makeGeometry(filter.primitive), this.materialFor(renderer));
      if (filter.primitive === "plane") mesh.rotation.x = -Math.PI / 2;
      mesh.castShadow = renderer ? renderer.castShadow !== false : true;
      mesh.receiveShadow = true;
      node.add(mesh);
      this.meshes.set(obj.id, mesh);
    } else if (filter && filter.primitive === "model") {
      const asset = this.assets.find((a) => a.id === filter.assetId);
      if (asset?.url) {
        try {
          const gltf = await this.loadModel(asset.url);
          const model = gltf.scene.clone(true);
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (renderer?.materialId) child.material = this.materialFor(renderer);
            }
          });
          node.add(model);
          this.meshes.set(obj.id, model);
        } catch {
          this.onError(`Failed to load model "${obj.name}"`);
        }
      }
    }

    const lightDef = comp(obj, "light");
    if (lightDef) {
      const light = this.makeLight(lightDef);
      node.add(light);
      this.lights.push(light);
    }

    const cc = comp(obj, "characterController");
    if (cc) {
      const ghost = new THREE.Mesh(
        new THREE.CapsuleGeometry(cc.radius || 0.35, Math.max(0.2, (cc.height || 1.8) - 0.7), 8, 16),
        new THREE.MeshStandardMaterial({ color: "#3b82f6", transparent: true, opacity: 0.35, roughness: 0.4 })
      );
      node.add(ghost);
    }
    return node;
  }

  applyBakedLighting() {
    const samples = this.data.bake?.samples;
    if (!samples) return;
    for (const [objectId, encoded] of Object.entries(samples)) {
      const entry = this.meshes.get(objectId);
      if (!entry) continue;
      if (entry.isMesh) {
        applyBakedToMesh(entry, encoded);
        continue;
      }
      entry.traverse((child) => {
        if (child.isMesh) applyBakedToMesh(child, encoded);
      });
    }
    this.onLog("Baked lighting applied", "info");
  }

  loadModel(url) {
    if (!this._modelCache) this._modelCache = new Map();
    if (!this._modelCache.has(url)) {
      const loader = new GLTFLoader();
      this._modelCache.set(
        url,
        new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject))
      );
    }
    return this._modelCache.get(url);
  }

  // ------------------------------------------------------------------ physics

  buildPhysics(byId) {
    for (const obj of this.data.objects) {
      const node = this.nodes.get(obj.id);
      if (!node) continue;
      const collider = comp(obj, "boxCollider") || comp(obj, "sphereCollider") || comp(obj, "capsuleCollider");
      const rb = comp(obj, "rigidbody");
      const cc = comp(obj, "characterController");
      if (!collider && !rb && !cc) continue;

      const s = node.scale;
      const half = { x: 0.5, y: 0.5, z: 0.5 };
      let radius = 0.5;
      if (collider?.type === "boxCollider") {
        const size = collider.size || [1, 1, 1];
        half.x = Math.abs(size[0] * s.x) / 2;
        half.y = Math.abs(size[1] * s.y) / 2;
        half.z = Math.abs(size[2] * s.z) / 2;
      } else if (collider?.type === "sphereCollider") {
        radius = (collider.radius || 0.5) * Math.max(Math.abs(s.x), Math.abs(s.y), Math.abs(s.z));
        half.x = half.y = half.z = radius;
      } else if (collider?.type === "capsuleCollider") {
        radius = (collider.radius || 0.4) * Math.max(Math.abs(s.x), Math.abs(s.z));
        half.x = half.z = radius;
        half.y = ((collider.height || 1.8) * Math.abs(s.y)) / 2;
      } else if (cc) {
        radius = cc.radius || 0.35;
        half.x = half.z = radius;
        half.y = (cc.height || 1.8) / 2;
      }

      const body = {
        obj,
        node,
        collider,
        rb,
        cc,
        radius,
        half,
        kind: cc ? "character" : rb ? (rb.isKinematic ? "kinematic" : "dynamic") : "static",
        vel: new THREE.Vector3(),
        grounded: false,
        mass: Number(rb?.mass ?? 1) || 1,
      };
      this.bodies.push(body);
      if (body.kind === "dynamic") this.dynamicBodies.push(body);
    }
  }

  buildControllers() {
    for (const body of this.bodies) {
      if (body.kind !== "character") continue;
      const camComp = comp(body.obj, "camera");
      const camEntry = camComp ? this.cameras.find((c) => c.objId === body.obj.id) : null;
      const controller = {
        body,
        node: body.node,
        obj: body.obj,
        cc: body.cc,
        height: body.cc.height || 1.8,
        radius: body.cc.radius || 0.35,
        vel: new THREE.Vector3(),
        grounded: false,
        yaw: 0,
        pitch: 0,
        camera: camEntry,
        enabled: true,
      };
      const rotation = body.obj.transform?.rotation || [0, 0, 0];
      controller.yaw = rotation[1] * DEG;
      this.controllers.push(controller);
    }
  }

  buildCameras() {
    for (const obj of this.data.objects) {
      const camComp = comp(obj, "camera");
      if (!camComp) continue;
      const node = this.nodes.get(obj.id);
      if (!node) continue;
      const cam = new THREE.PerspectiveCamera(camComp.fov || 60, this.aspect(), camComp.near || 0.1, camComp.far || 1000);
      cam.userData.objectId = obj.id;
      this.cameras.push({ objId: obj.id, obj, node, cam, comp: camComp });
    }
    this.activeCamera = this.cameras.find((c) => c.comp.isMain) || this.cameras[0] || null;
    if (!this.activeCamera) {
      const fallback = new THREE.PerspectiveCamera(60, this.aspect(), 0.1, 1000);
      fallback.position.set(0, 5, 12);
      fallback.lookAt(0, 1, 0);
      this.activeCamera = { objId: null, obj: null, node: null, cam: fallback, comp: { mode: "free" } };
    }
    this.renderCamera = this.activeCamera.cam;
  }

  aspect() {
    const el = this.container;
    if (!el) return 1.6;
    return Math.max(0.1, el.clientWidth / Math.max(1, el.clientHeight));
  }

  resize() {
    const el = this.container;
    if (!el) return;
    const aspect = this.aspect();
    for (const entry of this.cameras) {
      entry.cam.aspect = aspect;
      entry.cam.updateProjectionMatrix();
    }
    if (!this.cameras.length) {
      this.activeCamera.cam.aspect = aspect;
      this.activeCamera.cam.updateProjectionMatrix();
    }
  }

  heightAt(x, z) {
    const t = this.data.terrain;
    if (!t?.enabled || !t.heights?.length) return 0;
    const seg = t.segments || 48;
    const size = t.size || 60;
    const u = (x + size / 2) / size;
    const v = (z + size / 2) / size;
    if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
    const gx = clamp(u * seg, 0, seg - 0.0001);
    const gz = clamp(v * seg, 0, seg - 0.0001);
    const x0 = Math.floor(gx);
    const z0 = Math.floor(gz);
    const fx = gx - x0;
    const fz = gz - z0;
    const idx = (i, j) => (t.heights[j * (seg + 1) + i] || 0);
    const h00 = idx(x0, z0);
    const h10 = idx(x0 + 1, z0);
    const h01 = idx(x0, z0 + 1);
    const h11 = idx(x0 + 1, z0 + 1);
    return h00 * (1 - fx) * (1 - fz) + h10 * fx * (1 - fz) + h01 * (1 - fx) * fz + h11 * fx * fz;
  }

  resolvePair(a, b) {
    if (a.kind === "character" || b.kind === "character") return;
    if (a.kind === "static" && b.kind === "static") return;
    if (a.kind === "kinematic" && b.kind === "kinematic") return;
    const pa = a.node.position;
    const pb = b.node.position;
    const ox = a.half.x + b.half.x - Math.abs(pa.x - pb.x);
    const oy = a.half.y + b.half.y - Math.abs(pa.y - pb.y);
    const oz = a.half.z + b.half.z - Math.abs(pa.z - pb.z);
    if (ox <= 0 || oy <= 0 || oz <= 0) return;
    if (a.collider?.isTrigger || b.collider?.isTrigger) return;

    const axis = ox < oy && ox < oz ? "x" : oy < oz ? "y" : "z";
    const penetration = axis === "x" ? ox : axis === "y" ? oy : oz;
    const sign = Math.sign((pa[axis] - pb[axis]) || 1);

    const movable = [a, b].filter((body) => body.kind === "dynamic");
    if (!movable.length) return;
    const share = penetration / movable.length + 0.001;
    for (const body of movable) {
      const dir = body === a ? sign : -sign;
      body.node.position[axis] += dir * share;
      if ((body === a ? sign : -sign) * body.vel[axis] < 0) body.vel[axis] = 0;
      if (axis === "y") {
        body.grounded = dir > 0;
        if (dir > 0) {
          const bounce = Number(body.rb?.bounce ?? 0.15);
          body.vel.y = Math.abs(body.vel.y) > 2 ? Math.abs(body.vel.y) * bounce : 0;
        }
      }
    }
  }

  stepPhysics(dt) {
    for (const body of this.dynamicBodies) {
      if (body.rb?.useGravity !== false) body.vel.y -= this.gravity * dt;
      const drag = Number(body.rb?.drag ?? 0.02);
      body.vel.multiplyScalar(1 - Math.min(0.9, drag * dt * 6));
      body.node.position.addScaledVector(body.vel, dt);
      body.grounded = false;
      const ground = this.heightAt(body.node.position.x, body.node.position.z);
      if (body.node.position.y - body.half.y <= ground) {
        body.node.position.y = ground + body.half.y;
        if (body.vel.y < 0) body.vel.y = 0;
        body.grounded = true;
      }
    }
    for (let i = 0; i < this.bodies.length; i++) {
      for (let j = i + 1; j < this.bodies.length; j++) this.resolvePair(this.bodies[i], this.bodies[j]);
    }
  }

  groundHeightFor(controller) {
    const feet = controller.node.position.y - controller.height / 2;
    let ground = this.heightAt(controller.node.position.x, controller.node.position.z);
    for (const body of this.bodies) {
      if (body.kind === "character") continue;
      const dx = Math.abs(controller.node.position.x - body.node.position.x);
      const dz = Math.abs(controller.node.position.z - body.node.position.z);
      if (dx > body.half.x + controller.radius * 0.9 || dz > body.half.z + controller.radius * 0.9) continue;
      const top = body.node.position.y + body.half.y;
      if (top <= feet + 0.6 && top > ground) ground = top;
    }
    return ground;
  }

  moveController(controller, dx, dz) {
    controller.node.position.x += dx;
    controller.node.position.z += dz;
    const feet = controller.node.position.y - controller.height / 2;
    for (const body of this.bodies) {
      if (body.kind === "character") continue;
      if (body.collider?.isTrigger) continue;
      const px = controller.node.position.x;
      const pz = controller.node.position.z;
      const ox = body.half.x + controller.radius - Math.abs(px - body.node.position.x);
      const oz = body.half.z + controller.radius - Math.abs(pz - body.node.position.z);
      const oy = body.half.y + controller.height / 2 - Math.abs(controller.node.position.y - body.node.position.y);
      if (ox <= 0 || oz <= 0 || oy <= 0.05) continue;
      if (ox < oz) {
        controller.node.position.x += Math.sign(px - body.node.position.x || 1) * ox;
      } else {
        controller.node.position.z += Math.sign(pz - body.node.position.z || 1) * oz;
      }
      if (feet > body.node.position.y + body.half.y) continue;
    }
  }

  stepControllers(dt) {
    for (const controller of this.controllers) {
      const cc = controller.cc;
      const forwardInput = (this.input.isDown("w") || this.input.isDown("arrowup") ? 1 : 0) - (this.input.isDown("s") || this.input.isDown("arrowdown") ? 1 : 0);
      const strafeInput = (this.input.isDown("d") || this.input.isDown("arrowright") ? 1 : 0) - (this.input.isDown("a") || this.input.isDown("arrowleft") ? 1 : 0);
      const running = this.input.isDown("shift");
      const speed = Number(cc.speed ?? 5) * (running ? Number(cc.runMultiplier ?? 1.8) : 1);
      const sin = Math.sin(controller.yaw);
      const cos = Math.cos(controller.yaw);
      const mx = -sin * forwardInput + cos * strafeInput;
      const mz = -cos * forwardInput - sin * strafeInput;
      const len = Math.hypot(mx, mz);
      if (len > 0) this.moveController(controller, (mx / len) * speed * dt, (mz / len) * speed * dt);

      const gravity = Number(cc.gravity ?? this.gravity);
      controller.vel.y -= gravity * dt;
      controller.node.position.y += controller.vel.y * dt;
      const ground = this.groundHeightFor(controller);
      const feet = controller.node.position.y - controller.height / 2;
      if (feet <= ground + 0.02) {
        controller.node.position.y = ground + controller.height / 2;
        controller.vel.y = 0;
        controller.grounded = true;
      } else {
        controller.grounded = false;
      }
      if (this.input.wasPressed(" ") && controller.grounded) {
        controller.vel.y = Math.sqrt(2 * gravity * Math.max(0.2, Number(cc.jumpHeight ?? 1.5)));
        controller.grounded = false;
      }
      controller.node.rotation.y = controller.yaw;
    }
  }

  // ------------------------------------------------------------------- events

  bodyOverlap(a, b) {
    const pa = a.node.position;
    const pb = b.node.position;
    return (
      Math.abs(pa.x - pb.x) < a.half.x + b.half.x &&
      Math.abs(pa.y - pb.y) < a.half.y + b.half.y &&
      Math.abs(pa.z - pb.z) < a.half.z + b.half.z
    );
  }

  checkEvents() {
    const current = new Set();
    for (let i = 0; i < this.bodies.length; i++) {
      for (let j = i + 1; j < this.bodies.length; j++) {
        const a = this.bodies[i];
        const b = this.bodies[j];
        if (a.kind === "static" && b.kind === "static") continue;
        if (!this.bodyOverlap(a, b)) continue;
        const trigger = !!(a.collider?.isTrigger || b.collider?.isTrigger);
        const key = `${a.obj.id}|${b.obj.id}`;
        current.add(key);
        if (!this.pairs.has(key)) {
          this.pairs.set(key, { a, b, trigger });
          this.fireEvent(a, b, trigger ? "onTriggerEnter" : "onCollisionEnter");
          this.fireEvent(b, a, trigger ? "onTriggerEnter" : "onCollisionEnter");
        }
      }
    }
    for (const [key, pair] of this.pairs) {
      if (current.has(key)) continue;
      this.pairs.delete(key);
      this.fireEvent(pair.a, pair.b, pair.trigger ? "onTriggerExit" : "onCollisionExit");
      this.fireEvent(pair.b, pair.a, pair.trigger ? "onTriggerExit" : "onCollisionExit");
    }
  }

  fireEvent(body, otherBody, name) {
    for (const instance of this.instances) {
      if (instance.objectId !== body.obj.id) continue;
      const fn = instance.handlers[name];
      if (!fn) continue;
      try {
        fn(this.otherHandle(otherBody));
      } catch (error) {
        this.onError(`${instance.name}: ${error.message}`);
      }
    }
  }

  otherHandle(body) {
    const node = body.node;
    return {
      id: body.obj.id,
      name: body.obj.name,
      get position() {
        return { x: node.position.x, y: node.position.y, z: node.position.z };
      },
      velocity: { x: body.vel.x, y: body.vel.y, z: body.vel.z },
    };
  }

  // ------------------------------------------------------------------ scripts

  compileScript(source) {
    // Shadow the browser globals a game script should not reach for. `eval` cannot be a
    // parameter name in strict mode, so it stays reachable but sandboxed by the API surface.
    const guard = ["window", "document", "fetch", "XMLHttpRequest", "WebSocket", "Worker", "localStorage", "sessionStorage", "indexedDB", "globalThis", "self", "top", "parent", "opener", "importScripts"];
    const factory = new Function(
      "API",
      "console",
      ...guard,
      `"use strict";
const { object, input, time, scene, log, vec3, random } = API;
${source}
return {
  start: typeof start === "function" ? start : null,
  update: typeof update === "function" ? update : null,
  onCollisionEnter: typeof onCollisionEnter === "function" ? onCollisionEnter : null,
  onCollisionExit: typeof onCollisionExit === "function" ? onCollisionExit : null,
  onTriggerEnter: typeof onTriggerEnter === "function" ? onTriggerEnter : null,
  onTriggerExit: typeof onTriggerExit === "function" ? onTriggerExit : null
};`
    );
    return (api) =>
      factory(api, {
        log: (...args) => this.onLog(args.join(" "), "log"),
        warn: (...args) => this.onLog(args.join(" "), "warn"),
        error: (...args) => this.onLog(args.join(" "), "error"),
      });
  }

  makeHandle(obj, node) {
    const handle = {
      id: obj.id,
      name: obj.name,
      get active() {
        return node.visible;
      },
      setActive(value) {
        node.visible = !!value;
      },
      setPosition(x, y, z) {
        node.position.set(Number(x) || 0, Number(y) || 0, Number(z) || 0);
      },
      translate(x, y, z) {
        node.position.x += Number(x) || 0;
        node.position.y += Number(y) || 0;
        node.position.z += Number(z) || 0;
      },
      setRotation(x, y, z) {
        node.rotation.set((Number(x) || 0) * DEG, (Number(y) || 0) * DEG, (Number(z) || 0) * DEG);
      },
      rotate(x, y, z) {
        node.rotation.x += (Number(x) || 0) * DEG;
        node.rotation.y += (Number(y) || 0) * DEG;
        node.rotation.z += (Number(z) || 0) * DEG;
      },
      setScale(x, y, z) {
        node.scale.set(Number(x) || 1, Number(y) || 1, Number(z) || 1);
      },
      setColor(hex) {
        node.traverse((child) => {
          if (child.isMesh && child.material?.color) {
            child.material = child.material.clone();
            child.material.color.set(hex);
          }
        });
      },
      lookAt(target) {
        if (target?.x !== undefined) node.lookAt(target.x, target.y, target.z);
      },
      find: (name) => this.scene.getObjectByName(name) || null,
    };
    const position = {};
    for (const axis of ["x", "y", "z"]) {
      Object.defineProperty(position, axis, {
        enumerable: true,
        get: () => node.position[axis],
        set: (value) => {
          node.position[axis] = Number(value) || 0;
        },
      });
    }
    handle.position = position;
    const rotation = {};
    for (const axis of ["x", "y", "z"]) {
      Object.defineProperty(rotation, axis, {
        enumerable: true,
        get: () => node.rotation[axis] / DEG,
        set: (value) => {
          node.rotation[axis] = (Number(value) || 0) * DEG;
        },
      });
    }
    handle.rotation = rotation;
    const scale = {};
    for (const axis of ["x", "y", "z"]) {
      Object.defineProperty(scale, axis, {
        enumerable: true,
        get: () => node.scale[axis],
        set: (value) => {
          node.scale[axis] = Number(value) || 1;
        },
      });
    }
    handle.scale = scale;
    return handle;
  }

  initScripts() {
    for (const obj of this.data.objects) {
      const node = this.nodes.get(obj.id);
      if (!node) continue;
      const scriptComps = (obj.components || []).filter((c) => c.type === "script" && c.enabled !== false);
      for (const scriptComp of scriptComps) {
        const record = this.scripts.find((s) => s.id === scriptComp.scriptId);
        if (!record?.code) continue;
        const handle = this.makeHandle(obj, node);
        const api = {
          object: handle,
          input: this.input,
          time: {
            get deltaTime() {
              return 0;
            },
            get elapsed() {
              return 0;
            },
          },
          scene: {
            find: (name) => {
              const found = this.data.objects.find((o) => o.name === name);
              return found ? this.makeHandle(found, this.nodes.get(found.id)) : null;
            },
            get objects() {
              return [];
            },
            mainCamera: this.activeCamera?.obj ? { id: this.activeCamera.obj.id, name: this.activeCamera.obj.name } : null,
          },
          log: (...args) => this.onLog(`${record.name}: ${args.join(" ")}`, "log"),
          vec3: (x = 0, y = 0, z = 0) => ({ x, y, z }),
          random: (min = 0, max = 1) => min + Math.random() * (max - min),
        };
        // live time + scene views
        const player = this;
        Object.defineProperty(api.time, "deltaTime", { get: () => player.dt });
        Object.defineProperty(api.time, "elapsed", { get: () => player.elapsed });
        Object.defineProperty(api.scene, "objects", {
          get: () =>
            player.data.objects.map((o) => ({ id: o.id, name: o.name, position: player.nodes.get(o.id)?.position })),
        });

        let handlers = {};
        try {
          handlers = this.compileScript(record.code)(api);
        } catch (error) {
          this.onError(`${record.name} failed to compile: ${error.message}`);
          continue;
        }
        const instance = { name: record.name, objectId: obj.id, api, handlers };
        this.instances.push(instance);
        if (handlers.start) {
          try {
            handlers.start();
          } catch (error) {
            this.onError(`${record.name} start(): ${error.message}`);
          }
        }
      }
    }
  }

  updateScripts() {
    for (const instance of this.instances) {
      if (!instance.handlers.update) continue;
      try {
        instance.handlers.update();
      } catch (error) {
        this.onError(`${instance.name} update(): ${error.message}`);
        instance.handlers.update = null;
      }
    }
  }

  // -------------------------------------------------------------------- input

  initInput() {
    const onKeyDown = (event) => {
      const key = event.key.toLowerCase();
      if (["w", "a", "s", "d", " ", "shift", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)) {
        if (this.mouse.locked) event.preventDefault();
      }
      if (!this.keys.has(key)) this.pressed.add(key);
      this.keys.add(key);
    };
    const onKeyUp = (event) => this.keys.delete(event.key.toLowerCase());
    const onMouseDown = () => {
      this.mouse.down = true;
      if (!this.mouse.locked && this.container) this.requestPointerLock();
    };
    const onMouseUp = () => {
      this.mouse.down = false;
    };
    const onMouseMove = (event) => {
      if (!this.mouse.locked) return;
      const sens = 0.0022;
      if (this.controllers.length) {
        const controller = this.controllers[0];
        controller.yaw -= event.movementX * sens;
        controller.pitch = clamp(controller.pitch - event.movementY * sens, -1.35, 1.35);
      } else {
        this.freeYaw = (this.freeYaw ?? 0) - event.movementX * sens;
        this.freePitch = clamp((this.freePitch ?? 0) - event.movementY * sens, -1.35, 1.35);
      }
    };
    const onPointerLockChange = () => {
      this.mouse.locked = document.pointerLockElement === this.container;
    };

    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    this.container?.addEventListener("mousedown", onMouseDown);
    window.addEventListener("mouseup", onMouseUp);
    window.addEventListener("mousemove", onMouseMove);
    document.addEventListener("pointerlockchange", onPointerLockChange);
    this.listeners.push(
      () => window.removeEventListener("keydown", onKeyDown),
      () => window.removeEventListener("keyup", onKeyUp),
      () => this.container?.removeEventListener("mousedown", onMouseDown),
      () => window.removeEventListener("mouseup", onMouseUp),
      () => window.removeEventListener("mousemove", onMouseMove),
      () => document.removeEventListener("pointerlockchange", onPointerLockChange)
    );
  }

  requestPointerLock() {
    try {
      this.container?.requestPointerLock?.();
    } catch {
      /* ignore */
    }
  }

  // -------------------------------------------------------------------- audio

  initAudio() {
    this.listener = new THREE.AudioListener();
    this.camera.add(this.listener);
    this.audioLoader = new THREE.AudioLoader();
    for (const obj of this.data.objects) {
      const audioComp = comp(obj, "audioSource");
      if (audioComp?.playOnStart) this.playSound(obj);
    }
  }

  playSound(obj) {
    const audioComp = comp(obj, "audioSource");
    const asset = this.assets.find((a) => a.id === audioComp?.assetId);
    if (!asset?.url) return null;
    const node = this.nodes.get(obj.id);
    const sound = audioComp.spatial ? new THREE.PositionalAudio(this.listener) : new THREE.Audio(this.listener);
    sound.setVolume(clamp(Number(audioComp.volume ?? 0.8), 0, 1));
    sound.setLoop(!!audioComp.loop);
    if (audioComp.spatial) {
      sound.setRefDistance(Number(audioComp.minDistance ?? 1));
      sound.setMaxDistance(Number(audioComp.maxDistance ?? 18));
      node?.add(sound);
    }
    this.audioLoader.load(asset.url, (buffer) => {
      sound.setBuffer(buffer);
      sound.play();
    });
    return sound;
  }

  // ------------------------------------------------------------------- camera

  updateCamera(dt) {
    if (this.controllers.length) {
      const controller = this.controllers[0];
      const camEntry = controller.camera || this.activeCamera;
      const cam = camEntry.cam;
      const mode = camEntry.comp?.mode || "first";
      const head = new THREE.Vector3(
        controller.node.position.x,
        controller.node.position.y + controller.height * 0.38,
        controller.node.position.z
      );
      if (mode === "third") {
        const distance = 4.4;
        const offset = new THREE.Vector3(
          Math.sin(controller.yaw) * distance * Math.cos(controller.pitch),
          -Math.sin(controller.pitch) * distance + 1.1,
          Math.cos(controller.yaw) * distance * Math.cos(controller.pitch)
        );
        cam.position.copy(head).add(offset);
        cam.lookAt(head);
      } else {
        cam.position.copy(head);
        cam.rotation.set(controller.pitch, controller.yaw, 0, "YXZ");
      }
      this.renderCamera = cam;
      return;
    }

    if (this.activeCamera?.node) {
      const { node, cam, comp: camComp } = this.activeCamera;
      cam.fov = camComp.fov || cam.fov;
      cam.near = camComp.near || cam.near;
      cam.far = camComp.far || cam.far;
      cam.updateProjectionMatrix();
      if (this.mouse.locked) {
        // free-fly camera for scenes without a character controller
        const speed = (this.input.isDown("shift") ? 14 : 6) * dt;
        const forward = new THREE.Vector3(0, 0, -1).applyEuler(cam.rotation);
        const right = new THREE.Vector3(1, 0, 0).applyEuler(cam.rotation);
        if (this.input.isDown("w")) node.position.addScaledVector(forward, speed);
        if (this.input.isDown("s")) node.position.addScaledVector(forward, -speed);
        if (this.input.isDown("d")) node.position.addScaledVector(right, speed);
        if (this.input.isDown("a")) node.position.addScaledVector(right, -speed);
        if (this.input.isDown(" ")) node.position.y += speed;
        if (this.input.isDown("control")) node.position.y -= speed;
        cam.rotation.set(this.freePitch ?? 0, this.freeYaw ?? 0, 0, "YXZ");
        cam.position.copy(node.position);
      } else {
        node.updateMatrixWorld();
        node.matrixWorld.decompose(cam.position, cam.quaternion, new THREE.Vector3());
      }
      this.renderCamera = cam;
      return;
    }

    this.renderCamera = this.activeCamera.cam;
  }

  // --------------------------------------------------------------------- XR

  async checkXRSupport() {
    if (this.xr.checked) return this.xr.supported;
    this.xr.checked = true;
    if (typeof navigator === "undefined" || !navigator.xr?.isSessionSupported) return false;
    try {
      this.xr.supported = await navigator.xr.isSessionSupported("immersive-vr");
    } catch {
      this.xr.supported = false;
    }
    return this.xr.supported;
  }

  async enterVR() {
    const supported = await this.checkXRSupport();
    if (!supported) {
      this.onError("VR is not available in this browser or no headset is connected.");
      return false;
    }
    try {
      const session = await navigator.xr.requestSession("immersive-vr", {
        optionalFeatures: ["local-floor", "bounded-floor", "hand-tracking"],
      });
      this.renderer.xr.enabled = true;
      await this.renderer.xr.setSession(session);
      this.xr.session = session;
      session.addEventListener("end", () => {
        this.renderer.xr.enabled = false;
        this.xr.session = null;
      });
      this.setupXRControllers();
      this.onLog("VR session started", "info");
      return true;
    } catch (error) {
      this.onError(`Could not start VR: ${error.message}`);
      return false;
    }
  }

  setupXRControllers() {
    if (this.xr.controllers.length) return;
    for (let i = 0; i < 2; i++) {
      const controller = this.renderer.xr.getController(i);
      controller.userData.hand = i === 0 ? "left" : "right";
      const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
      const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: i === 0 ? "#4f9cf9" : "#f97362" }));
      line.scale.z = 6;
      controller.add(line);
      const hand = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.035, 0.09, 4, 8),
        new THREE.MeshStandardMaterial({ color: "#e6edf5", roughness: 0.5 })
      );
      hand.rotation.x = Math.PI / 2;
      controller.add(hand);
      controller.addEventListener("selectstart", () => this.interactFrom(controller));
      this.rig.add(controller);
      this.xr.controllers.push(controller);
    }
  }

  interactFrom(controller) {
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4().identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
    const hits = raycaster.intersectObjects(this.scene.children, true);
    for (const hit of hits) {
      let node = hit.object;
      while (node && !node.userData.objectId) node = node.parent;
      if (!node) continue;
      const body = this.bodies.find((b) => b.obj.id === node.userData.objectId);
      if (body?.kind === "dynamic") {
        const dir = raycaster.ray.direction.clone().multiplyScalar(6 / Math.max(0.4, body.mass));
        body.vel.add(dir);
      }
      break;
    }
  }

  stepVR(dt) {
    if (!this.xr.session) return;
    const sources = this.renderer.xr.getSession()?.inputSources || [];
    for (const source of sources) {
      const gamepad = source.gamepad;
      if (!gamepad || gamepad.axes.length < 4) continue;
      const x = gamepad.axes[2] || 0;
      const y = gamepad.axes[3] || 0;
      if (Math.abs(x) < 0.15 && Math.abs(y) < 0.15) continue;
      const camDir = new THREE.Vector3();
      this.camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();
      const right = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
      const speed = 2.4 * dt;
      if (this.controllers.length) {
        const controller = this.controllers[0];
        controller.node.position.addScaledVector(camDir, -y * speed);
        controller.node.position.addScaledVector(right, x * speed);
      } else {
        this.rig.position.addScaledVector(camDir, -y * speed);
        this.rig.position.addScaledVector(right, x * speed);
      }
    }

    // Hand tracking has no thumbstick: pinching glides you forward.
    const frame = this.renderer.xr.getFrame?.();
    const space = this.renderer.xr.getReferenceSpace?.();
    if (!frame || !space) return;
    for (const source of sources) {
      if (!source.hand) continue;
      const thumb = source.hand.get("thumb-tip");
      const index = source.hand.get("index-finger-tip");
      if (!thumb || !index) continue;
      const a = frame.getJointPose(thumb, space);
      const b = frame.getJointPose(index, space);
      if (!a || !b) continue;
      const gap = Math.hypot(
        a.transform.position.x - b.transform.position.x,
        a.transform.position.y - b.transform.position.y,
        a.transform.position.z - b.transform.position.z
      );
      if (gap > 0.025) continue;
      const camDir = new THREE.Vector3();
      this.camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();
      this.rig.position.addScaledVector(camDir, 2 * dt);
    }
  }

  // --------------------------------------------------------------------- loop

  tick() {
    if (this.disposed) return;
    const dt = Math.min(this.clock.getDelta(), 0.05);
    this.dt = dt;
    if (!this.paused) {
      this.elapsed += dt;
      this.stepControllers(dt);
      this.stepPhysics(dt);
      this.updateScripts();
      this.checkEvents();
      this.stepVR(dt);
      this.pressed.clear();
    }
    this.updateCamera(dt);
    this.renderer.render(this.scene, this.renderCamera);
    this._fpsFrames += 1;
    this._fpsTime += dt;
    if (this._fpsTime >= 0.5) {
      this.fps = Math.round(this._fpsFrames / this._fpsTime);
      this._fpsFrames = 0;
      this._fpsTime = 0;
      this.onFps(this.fps);
    }
  }
}
